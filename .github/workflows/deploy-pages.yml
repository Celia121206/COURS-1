# Publie le site sur GitHub Pages à chaque envoi sur la branche main :
# GitHub installe les dépendances, construit le site (dossier dist) et publie ce dossier.
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton "Run workflow" pour relancer à la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le site est servi sous https://celia121206.github.io/COURS-1/ : les fichiers doivent pointer vers /COURS-1/
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
